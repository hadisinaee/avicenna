name: Build and validate
on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hugo: ['0.168.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo }}
          extended: true
      - run: python3 scripts/validate.py
