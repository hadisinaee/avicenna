name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-example-site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo-version:
          - "0.160.0"
          - "0.160.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Validate bundled example site
        run: sh scripts/validate-example-site.sh
